version: 2

# The ERP (Enterprise Resource Planning) system is Oracle. It reaches us as a CDC (change data
# capture) feed: each row is an insert, update or delete, tagged in `op` (I, U or D) and stamped
# with `change_ts`. One CSV (comma-separated values) file per table arrives each night.
#
# Each source reads every file in its folder, all columns as text, by column name. A new or
# missing column does not stop the read; the source_columns_match test reports it.

sources:
  - name: erp
    description: >
      Enterprise Resource Planning (ERP) change feed, delivered by the ingestion team's managed
      connector. Files land in landing/erp/, one per table per night.
    tables:
      - name: branch
        description: Branch change feed. One row per change to a branch, including the WEB branch.
        config:
          meta:
            external_location: "read_csv('landing/erp/branch_*.csv', filename = true, union_by_name = true, all_varchar = true)"
        data_tests:
          - source_columns_match:
              arguments:
                expected_columns: [branch_id, branch_name, city, state, timezone, opened_date, op, change_ts, _ingested_at, filename]

      - name: customer
        description: Customer change feed. One row per change to an ERP customer.
        config:
          meta:
            external_location: "read_csv('landing/erp/customer_*.csv', filename = true, union_by_name = true, all_varchar = true)"
        data_tests:
          - source_columns_match:
              arguments:
                expected_columns: [customer_number, customer_name, industry_code, city, state, credit_limit, created_on, updated_on, op, change_ts, _ingested_at, filename]

      - name: product
        description: Product change feed. One row per change to a product, including cost changes.
        config:
          meta:
            external_location: "read_csv('landing/erp/product_*.csv', filename = true, union_by_name = true, all_varchar = true)"
        data_tests:
          - source_columns_match:
              arguments:
                expected_columns: [product_id, sku, product_name, category, uom, unit_cost, list_price, op, change_ts, _ingested_at, filename]

      - name: order_header
        description: Order header change feed. One row per change to an order header.
        config:
          meta:
            external_location: "read_csv('landing/erp/order_header_*.csv', filename = true, union_by_name = true, all_varchar = true)"
        data_tests:
          - source_columns_match:
              arguments:
                expected_columns: [order_number, customer_number, branch_id, order_datetime, order_total, currency, status, op, change_ts, _ingested_at, filename]

      - name: order_line
        description: Order line change feed. One row per change to an order line.
        config:
          meta:
            external_location: "read_csv('landing/erp/order_line_*.csv', filename = true, union_by_name = true, all_varchar = true)"
        data_tests:
          - source_columns_match:
              arguments:
                expected_columns: [order_number, line_number, product_id, quantity, unit_price, line_amount, op, change_ts, _ingested_at, filename]
